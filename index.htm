// Dimension cube: the counter climbs to the rolled dimension while the cube gains dimensions
// (point, line, square, cube, then a tesseract) and spins through 4D.
function drawCube(t, p) {
  const g = fxG, I = cut.Ib, n = cut.dimN;
  const D = Math.min(n, 1 + Math.floor(p * n));
  if (D !== cut.lastD) {
    cut.lastD = D;
    cut.kick = 0.5;
    if (D <= 4) { cut.kick = 1; flash(0.2); }
    fxText(cutBig, ordinal(D) + ' Dimension', 'dimension_section');
  }
  const k = Math.min(4, D);
  const ang = [t * 0.7, t * 0.45 + 0.4, t * 0.9, t * 0.35, t * 0.6, t * 0.5];
  const K = Math.min(W, H) * 2.2;
  const pts = [];
  for (let m = 0; m < (1 << k); m++) {
    const v = [0, 0, 0, 0];
    for (let b = 0; b < k; b++) v[b] = (m >> b) & 1 ? 1 : -1;
    EDGE_PLANES.forEach(([i, j], idx) => {
      const c = Math.cos(ang[idx]), s = Math.sin(ang[idx]);
      const vi = v[i], vj = v[j];
      v[i] = c * vi - s * vj;
      v[j] = s * vi + c * vj;
    });
    const f4 = 1 / (4 - v[3]);
    const f3 = 1 / (6 - v[2] * f4);
    pts.push({ x: W / 2 + v[0] * f4 * f3 * K, y: H / 2 + v[1] * f4 * f3 * K });
  }
  g.lineWidth = 2;
  for (let a = 0; a < pts.length; a++) {
    for (let b = a + 1; b < pts.length; b++) {
      const diff = a ^ b;
      if (diff & (diff - 1)) continue;          // an edge joins vertices that differ in one coordinate
      const A = pts[a], B = pts[b], col = pick(cut.colors, a + b);
      g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 12;
      g.globalAlpha = 0.85;
      g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    }
  }
  g.shadowBlur = 0; g.globalAlpha = 1;
  g.fillStyle = '#ffffff';
  for (const P of pts) { g.beginPath(); g.arc(P.x, P.y, 2 + 2 * I, 0, Math.PI * 2); g.fill(); }
}

// Scaled II: each letter slot runs A to Z, then stops in place, one after another.
// Background: a glow, falling letters and a scan line. T is the warped motion clock, eb the real seconds.
function drawLetters(T, eb) {
  const g = fxG;
  const beat = 0.5 + 0.5 * Math.sin(T * 4);
  const glow = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * (0.3 + 0.1 * beat));
  glow.addColorStop(0, 'rgba(0, 255, 179, 0.28)');
  glow.addColorStop(1, 'rgba(0, 255, 179, 0)');
  g.fillStyle = glow;
  g.fillRect(-40, -40, W + 80, H + 80);
  mGlyphs(T, cut.Ib, cut.colors);
  const y = wrap(T * H * 0.9, H + 40) - 20;
  g.globalAlpha = 0.35;
  g.fillStyle = cut.colors[0];
  g.fillRect(-20, y, W + 40, 3);
  g.globalAlpha = 1;
  updateSlots(eb);
}

// Slots land at fixed times in real seconds; before that they cycle A to Z
function updateSlots(e) {
  cut.slotEls.forEach((el, i) => {
    if (e >= cut.slotStops[i]) {
      if (!el.classList.contains('landed')) {
        el.classList.add('landed', 'land');
        el.textContent = cut.target[i];
        cut.kick = Math.max(cut.kick, 0.8);
        flash(0.12);
      }
    } else {
      el.textContent = GLYPH_LATIN[Math.floor(e * 30 + i * 9) % 26];
    }
  });
}

// Finale ("You"): every mode at once, the burst that leads into the reveal.
function drawFinale(t, p) {
  const cols = cut.colors;
  mSpiral(t, p, 1, cols, false);
  mRings(t, p, 1, cols);
  mShards(t, 1, cols);
  if (p > 0.35) mLightning(p, 1, cols);
}

// ---------- roll flow ----------
const rollBtn = document.getElementById('rollBtn');
const recentCard = document.getElementById('recentCard');
const recentTierEl = document.getElementById('recentTier');
const recentEl = document.getElementById('recentItem');
const bestTierEl = document.getElementById('bestTier');
const bestEl = document.getElementById('bestItem');
let busy = false;

// Odds are logarithmic (odds.js). Tiers with no cutscene land at once.
function rollRandom() {
  if (busy) return;
  const ti = pickTier();
  const ii = pickItem(DATA[TIER_KEYS[ti]].length);
  busy = true;
  rollBtn.disabled = true;
  startCut(ti, ii, () => settle(ti, ii));
}

// Runs when the screen is back: the roll goes into Most recent and, if it is the furthest, Best roll.
function settle(ti, ii) {
  const key = TIER_KEYS[ti];
  if (!state.found[key]) state.found[key] = [];
  if (!state.found[key].includes(ii)) state.found[key].push(ii);
  state.rolls = (state.rolls || 0) + 1;
  state.recent = [key, ii];
  if (!state.best || rankOf(state.recent) > rankOf(state.best)) state.best = [key, ii];
  save();
  showRoll(state.recent, recentTierEl, recentEl);
  showRoll(state.best, bestTierEl, bestEl);
  recentCard.classList.remove('pop');
  void recentCard.offsetWidth;
  recentCard.classList.add('pop');
  refreshProgress();
  busy = false;
  rollBtn.disabled = false;
}

function showRoll(pair, tierEl, itemEl) {
  if (!pair) { tierEl.textContent = '—'; itemEl.textContent = ''; return; }
  tierEl.textContent = prettyName(pair[0]);
  fxText(itemEl, DATA[pair[0]][pair[1]], pair[0]);
}

// ---------- the branch: every tier on one tree that grows from the centre. Move the mouse to look around. ----------
const branchC = document.getElementById('branch');
const bG = branchC.getContext('2d');
const tipEl = document.getElementById('tip');
const WORLD = 1250;                                   // half the width of the world the branch sits in
const BTN_RESET = { x: 1120, y: -1040, label: 'Reset', color: '#ff5252' };
const BTN_ACH = { x: -1120, y: 1040, label: 'Achievements', color: '#ffd740' };
const BTN_W = 170, BTN_H = 42;
let BRANCH_NODES = [], BRANCH_EDGES = [];
let branchOpen = false, branchRaf = 0;
let bCamX = 0, bCamY = 0, bTgtX = 0, bTgtY = 0, bPanX = 0, bPanY = 0;
let hoverNode = -1, pressX = 0, pressY = 0;

const cutActive = () => cut !== null;

// Symbol for a tier: its own, or the first glyph of its cutscene
function symbolFor(key) {
  if (SYMBOLS[key]) return SYMBOLS[key];
  const g = CUT[key] && CUT[key][2];
  return g ? [...g][0] : '◇';
}

// Grows the tree breadth-first from the centre, so tiers nearer the centre come first in the list
function layoutBranch() {
  const total = TIER_KEYS.length;
  const nodes = [{ x: 0, y: 0, ang: -Math.PI / 2, r: 0, depth: 0, parent: -1, ti: -1 }];
  const edges = [];
  for (let pi = 0; nodes.length < total + 1; pi++) {
    const P = nodes[pi];
    const kids = P.depth === 0 ? 6 : 2 + (mix(pi * 97 + 13) % 2);
    const spread = P.depth === 0 ? 0 : Math.max(0.5, 1.4 / (1 + 0.3 * P.depth));
    for (let k = 0; k < kids && nodes.length < total + 1; k++) {
      const jitter = ((mix(pi * 31 + k) % 1000) / 1000 - 0.5) * 0.28;
      const ang = P.depth === 0
        ? (k / kids) * Math.PI * 2 - Math.PI / 2 + jitter
        : P.ang + (k - (kids - 1) / 2) * spread / kids * 2 + jitter;
      const r = P.r + (P.depth === 0 ? 150 : 120 + (mix(pi * 13 + k) % 60));
      nodes.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r, ang, r, depth: P.depth + 1, parent: pi, ti: nodes.length - 1 });
      edges.push([pi, nodes.length - 1]);
    }
  }
  BRANCH_NODES = nodes;
  BRANCH_EDGES = edges;
}

function sizeBranch() {
  branchC.width = Math.round(W * DPR); branchC.height = Math.round(H * DPR);
  branchC.style.width = W + 'px'; branchC.style.height = H + 'px';
  bPanX = Math.max(0, WORLD - W / 2 + 60);             // how far the parallax can move the view
  bPanY = Math.max(0, WORLD - H / 2 + 60);
}

// Screen position of a world point, for the current camera
const toScreenX = x => W / 2 - bCamX + x;
const toScreenY = y => H / 2 - bCamY + y;

function nearestNode(sx, sy) {
  let best = -1, bestD = 22;
  BRANCH_NODES.forEach((nd, i) => {
    if (nd.ti < 0) return;
    const d = Math.hypot(toScreenX(nd.x) - sx, toScreenY(nd.y) - sy);
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}

function buttonAt(sx, sy) {
  const wx = sx - W / 2 + bCamX, wy = sy - H / 2 + bCamY;
  for (const b of [BTN_RESET, BTN_ACH]) {
    if (Math.abs(wx - b.x) < BTN_W / 2 && Math.abs(wy - b.y) < BTN_H / 2) return b;
  }
  return null;
}

function drawButton(b) {
  const x = toScreenX(b.x) - BTN_W / 2, y = toScreenY(b.y) - BTN_H / 2;
  bG.globalAlpha = 1;
  bG.fillStyle = '#000';
  bG.strokeStyle = b.color; bG.lineWidth = 1.5;
  bG.shadowColor = b.color; bG.shadowBlur = 14;
  bG.beginPath();
  if (bG.roundRect) bG.roundRect(x, y, BTN_W, BTN_H, BTN_H / 2); else bG.rect(x, y, BTN_W, BTN_H);
  bG.fill(); bG.stroke();
  bG.shadowBlur = 0;
  bG.fillStyle = '#f2f2f2';
  bG.font = '600 13px system-ui, sans-serif';
  bG.textAlign = 'center'; bG.textBaseline = 'middle';
  bG.fillText(b.label.toUpperCase(), toScreenX(b.x), toScreenY(b.y) + 1);
}

function branchFrame() {
  branchRaf = 0;
  if (!branchOpen) return;
  bCamX += (bTgtX - bCamX) * 0.08;
  bCamY += (bTgtY - bCamY) * 0.08;
  bG.setTransform(DPR, 0, 0, DPR, 0, 0);
  bG.clearRect(0, 0, W, H);
  bG.lineCap = 'round';
  for (const [a, b] of BRANCH_EDGES) {                  // branches, thinner further out
    const A = BRANCH_NODES[a], B = BRANCH_NODES[b];
    bG.strokeStyle = 'rgba(232, 236, 255, 0.35)';
    bG.lineWidth = Math.max(1, 5 - B.depth * 0.6);
    bG.beginPath(); bG.moveTo(toScreenX(A.x), toScreenY(A.y)); bG.lineTo(toScreenX(B.x), toScreenY(B.y)); bG.stroke();
  }
  bG.font = '16px system-ui, sans-serif';
  bG.textAlign = 'center'; bG.textBaseline = 'middle';
  BRANCH_NODES.forEach((nd, i) => {                     // one symbol per tier
    if (nd.ti < 0) return;
    const sx = toScreenX(nd.x), sy = toScreenY(nd.y);
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) return;
    const key = TIER_KEYS[nd.ti], got = (state.found[key] || []).length > 0;
    const col = STYLE[key] ? STYLE[key][1] : '#ffffff';
    const hot = i === hoverNode;
    bG.globalAlpha = got || hot ? 1 : 0.45;
    bG.fillStyle = '#000';
    bG.strokeStyle = col; bG.lineWidth = hot ? 3 : 1.5;
    bG.shadowColor = col; bG.shadowBlur = got || hot ? 14 : 0;
    bG.beginPath(); bG.arc(sx, sy, hot ? 20 : 15, 0, Math.PI * 2); bG.fill(); bG.stroke();
    bG.shadowBlur = 0;
    bG.fillStyle = got ? col : '#ffffff';
    bG.fillText(symbolFor(key), sx, sy + 1);
  });
  bG.globalAlpha = 1;
  drawButton(BTN_RESET);
  drawButton(BTN_ACH);
  branchRaf = requestAnimationFrame(branchFrame);
}

// The tooltip for the tier under the mouse
function updateTip(x, y) {
  if (hoverNode < 0) { tipEl.hidden = true; return; }
  const key = TIER_KEYS[BRANCH_NODES[hoverNode].ti];
  const got = (state.found[key] || []).length;
  tipEl.textContent = '';
  const t = document.createElement('strong');
  fxText(t, prettyName(key), key);
  const line = document.createElement('div');
  line.textContent = symbolFor(key) + '  ' + DATA[key].length + ' items · ' + got + ' found · ' +
    oddsText(tierChance(TIER_INDEX[key])) + ' a roll';
  tipEl.append(t, line);
  tipEl.hidden = false;
  tipEl.style.left = Math.min(W - 280, x + 18) + 'px';
  tipEl.style.top = Math.min(H - 80, y + 18) + 'px';
}

branchC.addEventListener('pointermove', e => {
  if (!branchOpen || cutActive() || tierOpen) return;
  bTgtX = (e.clientX / W * 2 - 1) * bPanX;              // the parallax: the view follows the mouse
  bTgtY = (e.clientY / H * 2 - 1) * bPanY;
  hoverNode = nearestNode(e.clientX, e.clientY);
  updateTip(e.clientX, e.clientY);
  branchC.style.cursor = hoverNode >= 0 || buttonAt(e.clientX, e.clientY) ? 'pointer' : 'default';
});
branchC.addEventListener('pointerdown', e => { pressX = e.clientX; pressY = e.clientY; });
branchC.addEventListener('pointerup', e => {
  if (!branchOpen || cutActive() || tierOpen || Math.hypot(e.clientX - pressX, e.clientY - pressY) > 6) return;
  const b = buttonAt(e.clientX, e.clientY);
  if (b === BTN_RESET) { openConfirm(); return; }
  if (b === BTN_ACH) { openAch(); return; }
  const i = nearestNode(e.clientX, e.clientY);
  if (i >= 0) openTier(BRANCH_NODES[i].ti);
});
branchC.addEventListener('pointerleave', () => { hoverNode = -1; tipEl.hidden = true; });

function openBranch() {
  branchOpen = true;
  document.body.classList.add('in-branch');
  branchC.hidden = false;
  sizeBranch();
  bTgtX = 0; bTgtY = 0;
  refreshProgress();
  if (!branchRaf) branchRaf = requestAnimationFrame(branchFrame);
}

function closeBranch() {
  closeConfirm(); closeAch(); closeTier();             // nothing stays open over the main screen
  branchOpen = false;
  document.body.classList.remove('in-branch');
  branchC.hidden = true;
  tipEl.hidden = true;
  hoverNode = -1;
}

// ---------- achievements: checked after every roll; each unlock pops up in the top right ----------
const ACHIEVEMENTS = [
  { id: 'first', name: 'First Roll', text: 'Roll for the first time.', test: s => s.rolls >= 1 },
  { id: 'roll10', name: 'Getting Warm', text: 'Roll 10 times.', test: s => s.rolls >= 10 },
  { id: 'roll100', name: 'Regular', text: 'Roll 100 times.', test: s => s.rolls >= 100 },
  { id: 'found10', name: 'Collector', text: 'Find 10 items.', test: s => s.found >= 10 },
  { id: 'found100', name: 'Curator', text: 'Find 100 items.', test: s => s.found >= 100 },
  { id: 'found1000', name: 'Archivist', text: 'Find 1,000 items.', test: s => s.found >= 1000 },
  { id: 'tiers5', name: 'Wide Net', text: 'Find items in 5 different tiers.', test: s => s.tiers >= 5 },
  { id: 'tiers20', name: 'Branching Out', text: 'Find items in 20 different tiers.', test: s => s.tiers >= 20 },
  { id: 'greek', name: 'Ancient Letters', text: 'Find an item in the Greek section.', test: s => s.has('greek_section') },
  { id: 'dimension', name: 'Fourth Dimension', text: 'Find an item in the Dimension section.', test: s => s.has('dimension_section') },
  { id: 'particle', name: 'Particle Physicist', text: 'Find a particle.', test: s => s.has('particle_section') },
  { id: 'element', name: 'Chemist', text: 'Find an element.', test: s => s.has('element_section') },
  { id: 'elements10', name: 'Periodic', text: 'Find 10 elements.', test: s => s.countIn('element_section') >= 10 },
  { id: 'constellation', name: 'Stargazer', text: 'Find an item in the Constellation section.', test: s => s.has('constellation_section') },
  { id: 'you', name: 'You', text: 'Find "You". Good luck.', test: s => s.has('last_section') },
];

// The numbers the achievements test against, read from the saved state
function achStats() {
  const found = Object.values(state.found);
  return {
    rolls: state.rolls || 0,
    found: found.reduce((a, arr) => a + arr.length, 0),
    tiers: found.filter(arr => arr.length > 0).length,
    has: k => (state.found[k] || []).length > 0,
    countIn: k => (state.found[k] || []).length,
  };
}

// Unlocks anything newly earned, shows each as a toast, and saves
function checkAchievements() {
  const s = achStats();
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    if (!state.ach[a.id] && a.test(s)) { state.ach[a.id] = true; fresh.push(a); }
  }
  if (fresh.length) {
    save();
    fresh.forEach(showToast);
    renderAchList();
  }
}

// ---------- panels: a tier's items, achievements, toasts, the fade to black and the reset check ----------
const veilEl = document.getElementById('veil');
const tierPanel = document.getElementById('tierPanel');
const tierTitle = document.getElementById('tierTitle');
const tierMeta = document.getElementById('tierMeta');
const tierItems = document.getElementById('tierItems');
const achPanel = document.getElementById('achPanel');
const achList = document.getElementById('achList');
const achCount = document.getElementById('achCount');
const confirmEl = document.getElementById('confirm');
const toastsEl = document.getElementById('toasts');
let tierOpen = false, tierKey = null, achOpen = false, confirmOpen = false, veilTimer = 0;

// Black veil: on = fade to black, then call `then`; off = fade back to the screen (CSS does the fading)
function fadeVeil(on, then) {
  veilEl.classList.toggle('on', on);
  clearTimeout(veilTimer);
  veilTimer = setTimeout(() => { if (then) then(); }, 600);
}

// ---------- a tier's items: the title, its odds, and every item (??? until found) ----------
function renderTierItems() {
  const key = tierKey, have = state.found[key] || [];
  fxText(tierTitle, prettyName(key), key);
  tierMeta.textContent = oddsText(tierChance(TIER_INDEX[key])) + ' a roll · ' + have.length + ' / ' + DATA[key].length + ' found';
  tierItems.textContent = '';
  const frag = document.createDocumentFragment();
  DATA[key].forEach((text, ii) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    fxText(span, have.includes(ii) ? text : '???', key);
    li.appendChild(span);
    frag.appendChild(li);
  });
  tierItems.appendChild(frag);
}

function openTier(ti) {
  if (cutActive() || tierOpen || achOpen || confirmOpen) return;
  const key = TIER_KEYS[ti];
  if (CUT[key][0] === 'none') {                         // no cutscene: fade to black, then the tier
    fadeVeil(true, () => { showTierPanel(ti); fadeVeil(false); });
    return;
  }
  startCut(ti, -1, () => showTierPanel(ti));          // the tier's own cutscene, then its items
}

function showTierPanel(ti) {
  tierKey = TIER_KEYS[ti];
  renderTierItems();
  tierPanel.classList.add('open');
  tierOpen = true;
}

function closeTier() {
  tierPanel.classList.remove('open');
  tierOpen = false;
}

// ---------- achievements: a list, opened after a fade to black ----------
function renderAchList() {
  const unlocked = ACHIEVEMENTS.filter(a => state.ach[a.id]).length;
  achCount.textContent = unlocked + ' / ' + ACHIEVEMENTS.length + ' unlocked';
  achList.textContent = '';
  const frag = document.createDocumentFragment();
  for (const a of ACHIEVEMENTS) {
    const li = document.createElement('li');
    li.className = state.ach[a.id] ? 'got' : '';
    const name = document.createElement('strong');
    name.textContent = state.ach[a.id] ? a.name : '???';
    const text = document.createElement('span');
    text.textContent = state.ach[a.id] ? a.text : 'Keep rolling to find out.';
    li.append(name, text);
    frag.appendChild(li);
  }
  achList.appendChild(frag);
}

function openAch() {
  if (cutActive() || tierOpen || achOpen || confirmOpen) return;
  fadeVeil(true, () => {
    renderAchList();
    achPanel.classList.add('open');
    achOpen = true;
    fadeVeil(false);
  });
}

function closeAch() {
  achPanel.classList.remove('open');
  achOpen = false;
}

// A new achievement slides in from the left and fades in, stays for 2 seconds, then goes back out
function showToast(a) {
  const el = document.createElement('div');
  el.className = 'toast';
  const name = document.createElement('strong');
  name.textContent = 'Achievement: ' + a.name;
  const text = document.createElement('span');
  text.textContent = a.text;
  el.append(name, text);
  toastsEl.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  setTimeout(() => el.classList.remove('in'), 2500);
  setTimeout(() => el.remove(), 3200);
}

// ---------- reset, after an "Are you sure?" ----------
function openConfirm() {
  if (cutActive() || tierOpen || achOpen || confirmOpen) return;
  confirmEl.hidden = false;
  confirmOpen = true;
}

function closeConfirm() {
  confirmEl.hidden = true;
  confirmOpen = false;
}

function doReset() {
  state = { found: {}, best: null, recent: null, rolls: 0, ach: {} };
  save();
  showRoll(null, recentTierEl, recentEl);
  showRoll(null, bestTierEl, bestEl);
  closeConfirm();
  refreshProgress();
}

// ---------- progress: the count on the branch, the achievements, and an open tier list ----------
function refreshProgress() {
  const total = Object.values(state.found).reduce((a, arr) => a + arr.length, 0);
  document.getElementById('branchCount').textContent = total + ' / ' + TOTAL_ITEMS + ' items found';
  if (tierOpen) renderTierItems();
  checkAchievements();
  if (achOpen) renderAchList();
}

// ---------- keys ----------
function onKey(e) {
  if (e.key === 'Escape') {
    if (confirmOpen) closeConfirm();
    else if (tierOpen) closeTier();
    else if (achOpen) closeAch();
    else if (branchOpen) closeBranch();
    else if (cutActive()) skipCut();
    return;
  }
  if (cutActive()) { if (e.key === 'Enter' || e.code === 'Space') skipCut(); return; }
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const overlay = branchOpen || tierOpen || achOpen || confirmOpen;
  if (e.code === 'Space' && !e.repeat && !overlay && !['BUTTON', 'INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) {
    e.preventDefault();
    rollRandom();
  }
}

// ---------- start ----------
initTiers();          // builds all 500 tiers and their odds; must run before saved progress is read
load();
sizeAll();
layoutBranch();
sizeBranch();
// achievements already earned are marked silently, so nothing pops up on a page load
for (const a of ACHIEVEMENTS) if (!state.ach[a.id] && a.test(achStats())) state.ach[a.id] = true;
showRoll(state.recent, recentTierEl, recentEl);
showRoll(state.best, bestTierEl, bestEl);
refreshProgress();
rollBtn.addEventListener('click', rollRandom);
document.getElementById('tiersBtn').addEventListener('click', openBranch);
document.getElementById('branchClose').addEventListener('click', closeBranch);
document.getElementById('achClose').addEventListener('click', closeAch);
document.getElementById('tierClose').addEventListener('click', closeTier);
document.getElementById('confirmYes').addEventListener('click', doReset);
document.getElementById('confirmNo').addEventListener('click', closeConfirm);
cutEl.addEventListener('click', skipCut);
addEventListener('keydown', onKey);
addEventListener('resize', () => { sizeAll(); sizeBranch(); });
requestAnimationFrame(starLoop);

</script>
